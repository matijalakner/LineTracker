[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strip-line-finder"
version = "0.3.0"
description = "Find thin vertical lines in images and videos using strip sampling, and drive a Thorlabs DC2200 current ramp."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.20.0",
    "pillow>=8.0.0",
    "opencv-python>=4.5.0",
    "pandas>=1.1.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.3"]

[project.scripts]
strip-line-finder = "line_finder.cli:main"

# src/ itself is the package (it has __init__.py and cli.py with relative imports),
# installed as `line_finder`, with the two subpackages below it.
[tool.setuptools]
packages = ["line_finder", "line_finder.strip_line_finder", "line_finder.Thorlabs"]

[tool.setuptools.package-dir]
line_finder = "src"
"line_finder.strip_line_finder" = "src/strip_line_finder"
"line_finder.Thorlabs" = "src/Thorlabs"