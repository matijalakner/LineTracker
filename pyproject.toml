[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strip-line-finder"
version = "0.4.0"
description = "Find thin vertical lines in images and videos, track their spacing over time, and drive Thorlabs DC2200 / PM40 instruments."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.20.0",
    "pillow>=8.0.0",
    "opencv-python>=4.5.0",
    "matplotlib>=3.3",
]

[project.optional-dependencies]
# Needed only for the control commands (plus the separate measurement_control package)
hardware = ["pyusb>=1.2"]

[project.scripts]
measurement = "line_finder.cli:main"

# src/ itself is the package (it has __init__.py and cli.py with relative imports),
# installed as `line_finder`, with the two subpackages below it.
[tool.setuptools]
packages = ["line_finder", "line_finder.strip_line_finder", "line_finder.ThorLabs"]

[tool.setuptools.package-dir]
line_finder = "src"
"line_finder.strip_line_finder" = "src/strip_line_finder"
"line_finder.ThorLabs" = "src/ThorLabs"
